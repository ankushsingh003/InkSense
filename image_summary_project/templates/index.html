{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 Image to Text Summarizer</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <div class="container">
        <header>
            <h1>📝 Image to Text Summarizer</h1>
            <p class="subtitle">Upload an image to get a textual description</p>
        </header>

        <div class="main-card">
            <div class="input-section">
                <!-- Upload Tab Only for simplicity, or keep both -->
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('upload')">📤 Upload Image</button>
                    <button class="tab" onclick="switchTab('url')">🔗 Image URL</button>
                </div>

                <div id="upload-tab" class="tab-content active">
                    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                        <p style="font-size: 3rem; margin-bottom: 10px;">🖼️</p>
                        <p>Click to browse or drag & drop</p>
                    </div>
                    <input type="file" id="fileInput" hidden accept="image/*" onchange="handleFileSelect(event)">
                </div>

                <div id="url-tab" class="tab-content">
                    <input type="text" id="urlInput" class="url-input" placeholder="https://example.com/image.jpg">
                </div>
            </div>

            <img id="preview" class="preview-image" style="display: none; max-height: 300px; margin: 20px auto;">

            <button class="predict-btn" id="generateBtn" onclick="generateCaption()">
                ✨ Generate Caption
            </button>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Analyzing image context...</p>
            </div>

            <div class="results" id="results" style="display: none;">
                <h2>Inferred Description:</h2>
                <div class="caption-box" id="captionText"></div>
            </div>

            <div id="errorMessage" class="error-message"></div>
        </div>

        <footer>
            <p>Powered by ViT-GPT2 & Django</p>
        </footer>
    </div>

    <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
